<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#24418F"/>
      <stop offset="1" stop-color="#2E7A78"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3E3B6"/>
      <stop offset="1" stop-color="#D9BF82"/>
    </linearGradient>
  </defs>

  <!-- temple base: two steps -->
  <rect x="22" y="222" width="212" height="13" rx="3" fill="url(#stone)" stroke="#8E7037" stroke-width="3"/>
  <rect x="10" y="236" width="236" height="14" rx="3" fill="#CDB074" stroke="#8E7037" stroke-width="3"/>

  <!-- arch frame (sandstone) -->
  <path d="M34 224 V116 A94 94 0 0 1 222 116 V224 Z" fill="url(#stone)" stroke="#8E7037" stroke-width="4" stroke-linejoin="round"/>
  <!-- column fluting on the two piers -->
  <g stroke="#C6A867" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
    <line x1="42" y1="132" x2="42" y2="216"/>
    <line x1="49" y1="128" x2="49" y2="216"/>
    <line x1="207" y1="128" x2="207" y2="216"/>
    <line x1="214" y1="132" x2="214" y2="216"/>
  </g>

  <!-- arch opening: the plot field -->
  <path d="M56 224 V118 A72 72 0 0 1 200 118 V224 Z" fill="url(#field)"/>

  <!-- keystone with a circuit node -->
  <path d="M116 18 H140 L136 44 H120 Z" fill="#CDB074" stroke="#8E7037" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="128" cy="31" r="5" fill="#2E7A78"/>

  <!-- setpoint (final value) -->
  <line x1="66" y1="132" x2="192" y2="132" stroke="#F3E3B6" stroke-opacity="0.45"
        stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>

  <!-- step response: rise, overshoot, settle -->
  <path d="M64 214 C 82 214, 86 110, 106 104 C 124 98, 128 148, 146 146
           C 160 144, 166 128, 192 132"
        fill="none" stroke="#F6E7B8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="106" cy="104" r="7" fill="#FFFFFF"/>
</svg>
